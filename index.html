<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- Hlavička a Progress bar -->
    <header class="mb-6 mt-2">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-2xl font-bold text-emerald-400">Moje Návyky</h1>
            <span id="dateLabel" class="text-xs text-slate-400"></span>
        </div>
        <div class="bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
            <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center mt-1 text-xs text-slate-400">
            <span id="progressText">0 z 0 splněno</span>
            <span id="streakText">🔥 Séries: 0 dní</span>
        </div>
    </header>

    <!-- Přidání nového návyku -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 mb-6 shadow-lg">
        <h2 class="text-sm font-semibold text-slate-300 mb-3">✨ Přidat vlastní návyk</h2>
        <div class="space-y-3">
            <input type="text" id="habitInput" placeholder="Název návyku (např. 15000 kroků)..." class="w-full p-3 rounded-xl bg-slate-900 text-white border border-slate-700 text-sm outline-none focus:border-emerald-500">
            <div class="flex gap-2">
                <select id="timeSlotInput" class="flex-1 p-2 rounded-xl bg-slate-900 text-white border border-slate-700 text-xs outline-none">
                    <option value="morning">🌅 Ráno</option>
                    <option value="afternoon">☀️ Odpoledne</option>
                    <option value="evening">🌙 Večer</option>
                </select>
                <input type="color" id="colorInput" value="#10b981" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 cursor-pointer p-1">
                <input type="text" id="iconInput" value="⭐" placeholder="Emoji" class="w-12 text-center p-2 rounded-xl bg-slate-900 text-white border border-slate-700 text-sm">
                <button onclick="addHabit()" class="bg-emerald-500 font-bold px-5 py-2 rounded-xl text-sm active:bg-emerald-600 text-slate-950">Přidat</button>
            </div>
        </div>
    </div>

    <!-- Seznam návyků rozdělený podle bloků -->
    <div id="sectionsContainer" class="space-y-6"></div>

    <script>
        // Výchozí sada návyků, pokud uživatel ještě žádné nemá
        const defaultHabits = [
            { id: 1, title: 'Pít dostatek vody', timeSlot: 'morning', color: '#3b82f6', icon: '💧', done: false, streak: 0 },
            { id: 2, title: 'Ustlat postel', timeSlot: 'morning', color: '#10b981', icon: '🛏️', done: false, streak: 0 },
            { id: 3, title: 'Vyčistit zuby (ráno)', timeSlot: 'morning', color: '#06b6d4', icon: '🪥', done: false, streak: 0 },
            { id: 4, title: 'Přečíst 10 stránek', timeSlot: 'afternoon', color: '#8b5cf6', icon: '📖', done: false, streak: 0 },
            { id: 5, title: 'Krátké protažení / cvičení', timeSlot: 'afternoon', color: '#f59e0b', icon: '🧘‍♂️', done: false, streak: 0 },
            { id: 6, title: 'Vykoupat se / sprcha', timeSlot: 'evening', color: '#ec4899', icon: '🚿', done: false, streak: 0 },
            { id: 7, title: 'Vyčistit zuby (večer)', timeSlot: 'evening', color: '#06b6d4', icon: '🪥', done: false, streak: 0 }
        ];

        let habits = JSON.parse(localStorage.getItem('habits_v2')) || defaultHabits;
        
        // Kontrola denního resetu podle data
        const todayStr = new Date().toDateString();
        const lastSavedDate = localStorage.getItem('last_saved_date');
        if (lastSavedDate !== todayStr) {
            habits.forEach(h => h.done = false); // Půlnoční reset stavu splnění
            localStorage.setItem('last_saved_date', todayStr);
        }

        document.getElementById('dateLabel').innerText = new Date().toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });

        function saveAndRender() {
            localStorage.setItem('habits_v2', JSON.stringify(habits));
            render();
        }

        function render() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            const slots = [
                { key: 'morning', title: '🌅 Ranní návyky' },
                { key: 'afternoon', title: '☀️ Odpolední návyky' },
                { key: 'evening', title: '🌙 Večerní návyky' }
            ];

            let totalDone = 0;
            let totalCount = habits.length;

            slots.forEach(slot => {
                const slotHabits = habits.filter(h => h.timeSlot === slot.key);
                if (slotHabits.length === 0) return;

                let html = `
                    <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800">
                        <h3 class="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">${slot.title}</h3>
                        <div class="space-y-2">
                `;

                slotHabits.forEach(habit => {
                    if (habit.done) totalDone++;
                    const realIndex = habits.findIndex(h => h.id === habit.id);

                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-slate-800 rounded-xl border border-slate-700/60 transition-all">
                            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleHabit(${realIndex})">
                                <span class="text-xl w-8 h-8 flex items-center justify-center rounded-lg" style="background-color: ${habit.color}20; color: ${habit.color}">${habit.icon}</span>
                                <div>
                                    <span class="${habit.done ? 'line-through text-slate-500' : 'text-white font-medium'} text-sm block">${habit.title}</span>
                                    <span class="text-[10px] text-slate-400">🔥 ${habit.streak} dní v řadě</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleHabit(${realIndex})" class="w-8 h-8 rounded-full flex items-center justify-center text-sm border ${habit.done ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-bold' : 'border-slate-600 bg-slate-900 text-transparent'}">
                                    ${habit.done ? '✓' : ''}
                                </button>
                                <button onclick="deleteHabit(${realIndex})" class="text-slate-500 hover:text-red-400 p-1 text-xs">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });

            // Update Progress Bar
            const percent = totalCount > 0 ? Math.round((totalDone / totalCount) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `${totalDone} z ${totalCount} splněno (${percent} %)`;
            
            const maxStreak = habits.length > 0 ? Math.max(...habits.map(h => h.streak)) : 0;
            document.getElementById('streakText').innerText = `🔥 Max série: ${maxStreak} dní`;
        }

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            if (habits[index].done) {
                habits[index].streak += 1;
            } else {
                habits[index].streak = Math.max(0, habits[index].streak - 1);
            }
            saveAndRender();
        }

        function addHabit() {
            const titleInput = document.getElementById('habitInput');
            if (!titleInput.value.trim()) return;

            const newHabit = {
                id: Date.now(),
                title: titleInput.value.trim(),
                timeSlot: document.getElementById('timeSlotInput').value,
                color: document.getElementById('colorInput').value,
                icon: document.getElementById('iconInput').value || '⭐',
                done: false,
                streak: 0
            };

            habits.push(newHabit);
            titleInput.value = '';
            saveAndRender();
        }

        function deleteHabit(index) {
            if (confirm('Opravdu chceš tento návyk smazat?')) {
                habits.splice(index, 1);
                saveAndRender();
            }
        }

        render();
    </script>
</body>
</html>
