<!DOCTYPE html>
<html lang="cs" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        input[type="text"].app-title-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }
        :root {
            --accent-color: #10b981; 
        }
        .accent-text { color: var(--accent-color) !important; }
        .accent-bg { background-color: var(--accent-color) !important; }
        .accent-border { border-color: var(--accent-color) !important; }
        input.app-title-input:focus {
            border-bottom: 1px dashed var(--accent-color);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-28 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300">

    <!-- Hlavička a Progress bar -->
    <header class="mb-6 mt-2 relative">
        <div class="flex justify-between items-center mb-2">
            <input type="text" id="appTitleInput" value="Moje Návyky" onchange="saveAppTitle(this.value)" class="text-2xl font-bold accent-text app-title-input" placeholder="Název aplikace...">
            
            <div class="flex items-center gap-1.5 shrink-0 ml-2 relative">
                <!-- Tlačítko pro rozbalení palety barev -->
                <div class="relative">
                    <button onclick="toggleColorMenu()" class="w-9 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-sm transition-transform active:scale-90" title="Vybrat barvu">
                        🎨
                    </button>
                    <div id="colorMenu" class="hidden absolute right-0 mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-2 z-50 flex gap-2">
                        <button onclick="setAccentColor(0)" class="w-7 h-7 rounded-full bg-emerald-500 hover:scale-110 transition-transform" title="Zelená"></button>
                        <button onclick="setAccentColor(1)" class="w-7 h-7 rounded-full bg-red-500 hover:scale-110 transition-transform" title="Červená"></button>
                        <button onclick="setAccentColor(2)" class="w-7 h-7 rounded-full bg-blue-500 hover:scale-110 transition-transform" title="Modrá"></button>
                        <button onclick="setAccentColor(3)" class="w-7 h-7 rounded-full bg-purple-500 hover:scale-110 transition-transform" title="Fialová"></button>
                        <button onclick="setAccentColor(4)" class="w-7 h-7 rounded-full bg-amber-500 hover:scale-110 transition-transform" title="Oranžová"></button>
                    </div>
                </div>

                <!-- Tlačítko pro přepínání režimu (Světlý / Tmavý) -->
                <button onclick="toggleTheme()" id="themeToggleBtn" class="w-9 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-base transition-transform active:scale-90" title="Přepnout vzhled">
                    🌙
                </button>
                <span id="dateLabel" class="text-xs text-slate-500 dark:text-slate-400 capitalize ml-1"></span>
            </div>
        </div>
        <div class="bg-slate-200 dark:bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner">
            <div id="progressBar" class="accent-bg h-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center mt-1.5 text-xs text-slate-500 dark:text-slate-400">
            <span id="progressText">0 z 0 splněno</span>
            <span id="streakText">🔥 Max série: 0 dní</span>
        </div>
    </header>

    <!-- Seznam návyků -->
    <div id="sectionsContainer" class="space-y-4"></div>

    <!-- Plovoucí tlačítka vpravo dole -->
    <div class="fixed bottom-6 right-6 flex items-center gap-3 z-40">
        <button onclick="openStatsModal()" class="w-14 h-14 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-full shadow-xl flex items-center justify-center text-2xl transition-all" title="Statistiky">
            📊
        </button>
        <button onclick="openCatalogModal()" class="w-14 h-14 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 accent-text border border-slate-200 dark:border-slate-700 rounded-full shadow-xl flex items-center justify-center text-2xl transition-all" title="Kniha návyků">
            📚
        </button>
        <button onclick="openModal()" class="w-14 h-14 accent-bg hover:opacity-90 active:scale-95 text-white dark:text-slate-950 rounded-full shadow-xl flex items-center justify-center text-3xl font-bold transition-all">
            +
        </button>
    </div>

    <!-- Modální okno: Přidání vlastního návyku -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold">✨ Nový návyk</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Název návyku</label>
                    <input type="text" id="habitInput" placeholder="Např. 15 000 kroků..." class="w-full p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none transition-colors">
                </div>

                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Kdy ho chceš plnit?</label>
                    <select id="timeSlotInput" class="w-full p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none transition-colors">
                        <option value="priority">🎯 Denní priorita (Celý den)</option>
                        <option value="morning" selected>🌅 Ráno</option>
                        <option value="afternoon">☀️ Odpoledne</option>
                        <option value="evening">🌙 Večer</option>
                    </select>
                </div>

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Ikona (Emoji)</label>
                        <input type="text" id="iconInput" value="⭐" class="w-full text-center p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-lg">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Barva štítku</label>
                        <input type="color" id="colorInput" value="#10b981" class="w-full h-[50px] rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer p-1">
                    </div>
                </div>

                <button onclick="addHabit()" class="w-full accent-bg font-bold py-3.5 rounded-2xl text-sm active:scale-95 text-white dark:text-slate-950 mt-2 shadow-lg transition-all">
                    Uložit návyk
                </button>
            </div>
        </div>
    </div>

    <!-- Modální okno: Katalog návyků -->
    <div id="catalogModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md max-h-[85vh] flex flex-col p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h2 class="text-base font-bold">📚 Knihovna návyků</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Přidej si ověřené návyky jedním kliknutím</p>
                </div>
                <button onclick="closeCatalogModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div id="catalogList" class="overflow-y-auto space-y-3 pr-1 flex-1 py-2"></div>
        </div>
    </div>

    <!-- Modální okno: Statistiky a přehled sérií -->
    <div id="statsModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md max-h-[85vh] flex flex-col p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h2 class="text-base font-bold">📊 Statistiky a série</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Celkové skóre a přehled jednotlivých návyků</p>
                </div>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div id="statsContent" class="overflow-y-auto space-y-4 pr-1 flex-1 py-2"></div>
        </div>
    </div>
    <script>
        function getDateKey(dateObj = new Date()) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getYesterdayKey() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            return getDateKey(yesterday);
        }

        const todayKey = getDateKey();
        const yesterdayKey = getYesterdayKey();

        const accentPalettes = [
            { name: 'Zelená', color: '#10b981' },
            { name: 'Červená', color: '#ef4444' },
            { name: 'Modrá', color: '#3b82f6' },
            { name: 'Fialová', color: '#8b5cf6' },
            { name: 'Oranžová', color: '#f59e0b' }
        ];

        let currentAccentIndex = parseInt(localStorage.getItem('app_accent_idx')) || 0;
        applyAccentColor(currentAccentIndex);

        function toggleColorMenu() {
            const menu = document.getElementById('colorMenu');
            menu.classList.toggle('hidden');
        }

        function setAccentColor(index) {
            triggerHaptic();
            currentAccentIndex = index;
            applyAccentColor(index);
            localStorage.setItem('app_accent_idx', index);
            document.getElementById('colorMenu').classList.add('hidden');
        }

        function applyAccentColor(index) {
            const palette = accentPalettes[index];
            document.documentElement.style.setProperty('--accent-color', palette.color);
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('colorMenu');
            const btn = e.target.closest('button');
            if (!btn || (!btn.getAttribute('onclick')?.includes('toggleColorMenu') && !btn.getAttribute('onclick')?.includes('setAccentColor'))) {
                menu.classList.add('hidden');
            }
        });

        const htmlRoot = document.getElementById('htmlRoot');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        let currentTheme = localStorage.getItem('app_theme');
        if (!currentTheme) {
            currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        applyTheme(currentTheme);

        function toggleTheme() {
            triggerHaptic();
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
            localStorage.setItem('app_theme', currentTheme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                htmlRoot.classList.add('dark');
                themeBtn.innerText = '☀️';
            } else {
                htmlRoot.classList.remove('dark');
                themeBtn.innerText = '🌙';
            }
        }

        const presetCatalog = [
            { title: 'Trénink / Cvičení 45 min', timeSlot: 'priority', color: '#f59e0b', icon: '🏋️‍♂️' },
            { title: 'Ujít 10 000 kroků', timeSlot: 'priority', color: '#f59e0b', icon: '👟' },
            { title: 'Splnit hlavní pracovní úkol', timeSlot: 'priority', color: '#f59e0b', icon: '🎯' },
            { title: 'Žádné slazené nápoje', timeSlot: 'priority', color: '#f59e0b', icon: '🚫' },
            { title: 'Utrácet s rozmyslem', timeSlot: 'priority', color: '#f59e0b', icon: '💳' },
            
            { title: 'Pít dostatek vody (sklenice po probuzení)', timeSlot: 'morning', color: '#3b82f6', icon: '💧' },
            { title: 'Ustlat postel', timeSlot: 'morning', color: '#10b981', icon: '🛏️' },
            { title: 'Ranní protažení / jóga 10 min', timeSlot: 'morning', color: '#10b981', icon: '🧘‍♂️' },
            { title: 'Vyčistit zuby (ráno)', timeSlot: 'morning', color: '#06b6d4', icon: '🪥' },
            { title: 'Studená sprcha / otužování', timeSlot: 'morning', color: '#06b6d4', icon: '🚿' },
            { title: 'Zdravá snídaně bez cukru', timeSlot: 'morning', color: '#10b981', icon: '🍳' },
            { title: 'Vzít ranní doplňky stravy / vitamíny', timeSlot: 'morning', color: '#8b5cf6', icon: '💊' },
            { title: 'Ranní káva v klidu bez telefonu', timeSlot: 'morning', color: '#f59e0b', icon: '☕' },
            { title: 'Zápis vděčnosti (3 věci)', timeSlot: 'morning', color: '#ec4899', icon: '✍️' },
            { title: 'Vyvětrat ložnici', timeSlot: 'morning', color: '#3b82f6', icon: '🪟' },

            { title: 'Přečíst 10 stránek knížky', timeSlot: 'afternoon', color: '#8b5cf6', icon: '📖' },
            { title: 'Krátká procházka na denním světle', timeSlot: 'afternoon', color: '#3b82f6', icon: '🌳' },
            { title: 'Práce na vlastním projektu / snu', timeSlot: 'afternoon', color: '#6366f1', icon: '💻' },
            { title: 'Uklidit si pracovní stůl', timeSlot: 'afternoon', color: '#10b981', icon: '🧽' },
            { title: 'Jíst ovoce nebo zeleninu', timeSlot: 'afternoon', color: '#10b981', icon: '🍎' },
            { title: 'Procvičit cizí jazyk (10 min)', timeSlot: 'afternoon', color: '#f59e0b', icon: '🌍' },
            { title: 'Vyřídit důležité maily / zprávy', timeSlot: 'afternoon', color: '#3b82f6', icon: '✉️' },
            { title: 'Chvilka ticha bez obrazovek', timeSlot: 'afternoon', color: '#8b5cf6', icon: '🧘' },
            { title: 'Dýchací cvičení / pauza', timeSlot: 'afternoon', color: '#06b6d4', icon: '🌬️' },

            { title: 'Vykoupat se / sprcha', timeSlot: 'evening', color: '#6366f1', icon: '🚿' },
            { title: 'Vyčistit zuby a mezizubní kartáčky', timeSlot: 'evening', color: '#06b6d4', icon: '🪥' },
            { title: 'Vypnout obrazovky 30 min před spaním', timeSlot: 'evening', color: '#ec4899', icon: '📵' },
            { title: 'Připravit věci na zítřek', timeSlot: 'evening', color: '#f59e0b', icon: '🎒' },
            { title: 'Zkontrolovat plán na zítřejší den', timeSlot: 'evening', color: '#3b82f6', icon: '📅' },
            { title: 'Vyvětrat ložnici před spaním', timeSlot: 'evening', color: '#3b82f6', icon: '🌙' },
            { title: 'Přečíst si kapitolu před spaním', timeSlot: 'evening', color: '#8b5cf6', icon: '🛌' },
            { title: 'Jít spát včas (do 23:00)', timeSlot: 'evening', color: '#6366f1', icon: '😴' }
        ];

        const defaultHabits = [
            { id: 10, title: 'Splnit hlavní denní cíl / trénink', timeSlot: 'priority', color: '#f59e0b', icon: '🎯', done: false, streak: 0, bestStreak: 0, totalCompletions: 0, lastDoneDate: null },
            { id: 1, title: 'Pít dostatek vody', timeSlot: 'morning', color: '#3b82f6', icon: '💧', done: false, streak: 0, bestStreak: 0, totalCompletions: 0, lastDoneDate: null },
            { id: 2, title: 'Ustlat postel', timeSlot: 'morning', color: '#10b981', icon: '🛏️', done: false, streak: 0, bestStreak: 0, totalCompletions: 0, lastDoneDate: null },
            { id: 3, title: 'Vyčistit zuby (ráno)', timeSlot: 'morning', color: '#06b6d4', icon: '🪥', done: false, streak: 0, bestStreak: 0, totalCompletions: 0, lastDoneDate: null },
            { id: 4, title: 'Přečíst 10 stránek', timeSlot: 'afternoon', color: '#8b5cf6', icon: '📖', done: false, streak: 0, bestStreak: 0, totalCompletions: 0, lastDoneDate: null }
        ];

        let completedDays = JSON.parse(localStorage.getItem('completed_days_v7')) || [];
        let habits = JSON.parse(localStorage.getItem('habits_v7')) || defaultHabits;
        let savedTitle = localStorage.getItem('app_title_v7') || 'Moje Návyky';
        document.getElementById('appTitleInput').value = savedTitle;

        let manuallyExpanded = {};

        const lastSavedDate = localStorage.getItem('last_saved_date_v7');
        if (lastSavedDate && lastSavedDate !== todayKey) {
            habits.forEach(h => {
                if (h.lastDoneDate !== yesterdayKey && h.lastDoneDate !== todayKey) {
                    h.streak = 0;
                }
                h.done = false;
            });
        }
        localStorage.setItem('last_saved_date_v7', todayKey);

        habits.forEach(h => {
            h.done = (h.lastDoneDate === todayKey);
            if (typeof h.bestStreak !== 'number') h.bestStreak = h.streak || 0;
            if (typeof h.totalCompletions !== 'number') h.totalCompletions = h.streak || 0;
        });

        document.getElementById('dateLabel').innerText = new Date().toLocaleDateString('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric' });

        function saveAppTitle(val) {
            localStorage.setItem('app_title_v7', val.trim() || 'Moje Návyky');
        }

        function triggerHaptic() {
            if (window.navigator && typeof window.navigator.vibrate === 'function') {
                window.navigator.vibrate([30, 40, 30]);
            }
        }

        function openModal() {
            const modal = document.getElementById('addModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('habitInput').focus();
        }

        function closeModal() {
            const modal = document.getElementById('addModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openCatalogModal() {
            renderCatalog();
            const modal = document.getElementById('catalogModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCatalogModal() {
            const modal = document.getElementById('catalogModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openStatsModal() {
            renderStats();
            const modal = document.getElementById('statsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeStatsModal() {
            const modal = document.getElementById('statsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function updateCompletedDays() {
            const anyDoneToday = habits.some(h => h.done);
            const idx = completedDays.indexOf(todayKey);
            if (anyDoneToday && idx === -1) {
                completedDays.push(todayKey);
            } else if (!anyDoneToday && idx !== -1) {
                completedDays.splice(idx, 1);
            }
            localStorage.setItem('completed_days_v7', JSON.stringify(completedDays));
        }

        function renderCatalog() {
            const list = document.getElementById('catalogList');
            list.innerHTML = '';

            const slotNames = {
                priority: '🎯 Denní priority',
                morning: '🌅 Ranní návyky',
                afternoon: '☀️ Odpolední návyky',
                evening: '🌙 Večer'
            };

            presetCatalog.forEach((item, idx) => {
                const alreadyAdded = habits.some(h => h.title.toLowerCase() === item.title.toLowerCase());

                list.innerHTML += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700/60 transition-all">
                        <div class="flex items-center gap-3">
                            <span class="text-xl w-9 h-9 flex items-center justify-center rounded-xl shrink-0 shadow-sm" style="background-color: ${item.color}25; color: ${item.color}">${item.icon}</span>
                            <div>
                                <span class="text-slate-900 dark:text-white text-xs font-semibold block">${item.title}</span>
                                <span class="text-[10px] text-slate-500 dark:text-slate-400">${slotNames[item.timeSlot]}</span>
                            </div>
                        </div>
                        <button onclick="addPresetToHabits(${idx})" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${alreadyAdded ? 'bg-slate-200 dark:bg-slate-700 text-slate-400 cursor-not-allowed' : 'accent-bg text-white dark:text-slate-950 active:scale-95 shadow-md'}" ${alreadyAdded ? 'disabled' : ''}>
                            ${alreadyAdded ? 'Přidáno' : '+ Přidat'}
                        </button>
                    </div>
                `;
            });
        }

        function addPresetToHabits(idx) {
            triggerHaptic();
            const preset = presetCatalog[idx];
            const newHabit = {
                id: Date.now() + Math.random(),
                title: preset.title,
                timeSlot: preset.timeSlot,
                color: preset.color,
                icon: preset.icon,
                done: false,
                streak: 0,
                bestStreak: 0,
                totalCompletions: 0,
                lastDoneDate: null
            };
            habits.push(newHabit);
            manuallyExpanded[preset.timeSlot] = true;
            saveAndRender();
            renderCatalog();
        }

        function renderStats() {
            const container = document.getElementById('statsContent');
            
            const totalDaysCount = completedDays.length;
            const totalCompletionsAll = habits.reduce((sum, h) => sum + (h.totalCompletions || 0), 0);
            const overallBestStreak = habits.length > 0 ? Math.max(...habits.map(h => h.bestStreak || 0)) : 0;

            const slots = [
                { key: 'priority', label: '🎯 Denní priority' },
                { key: 'morning', label: '🌅 Ranní návyky' },
                { key: 'afternoon', label: '☀️ Odpolední návyky' },
                { key: 'evening', label: '🌙 Večerní návyky' }
            ];

            let slotStatsHtml = '';
            slots.forEach(s => {
                const sHabits = habits.filter(h => h.timeSlot === s.key);
                const sCompletions = sHabits.reduce((sum, h) => sum + (h.totalCompletions || 0), 0);
                const sMaxStreak = sHabits.length > 0 ? Math.max(...sHabits.map(h => h.streak || 0)) : 0;
                slotStatsHtml += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800/70 rounded-2xl border border-slate-200/70 dark:border-slate-700/50 text-xs">
                        <span class="font-semibold">${s.label}</span>
                        <span class="text-slate-500 dark:text-slate-400">🔥 max ${sMaxStreak} d • ✓ ${sCompletions}×</span>
                    </div>
                `;
            });

            const sortedHabits = [...habits].sort((a, b) => (b.streak || 0) - (a.streak || 0));
            let habitsStatsHtml = '';
            sortedHabits.forEach(h => {
                habitsStatsHtml += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-800/70 rounded-2xl border border-slate-200/70 dark:border-slate-700/50">
                        <div class="flex items-center gap-2.5">
                            <span class="text-lg">${h.icon}</span>
                            <div>
                                <span class="text-xs font-semibold block">${h.title}</span>
                                <span class="text-[10px] text-slate-500 dark:text-slate-400">Celkem splněno: ${h.totalCompletions || 0}× • Rekord: ${h.bestStreak || 0} dní</span>
                            </div>
                        </div>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-xl bg-slate-200/80 dark:bg-slate-700/80 accent-text">
                            🔥 ${h.streak || 0} d
                        </span>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="grid grid-cols-3 gap-2.5 text-center">
                    <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span class="text-lg font-bold accent-text block">${totalDaysCount}</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">Aktivních dnů</span>
                    </div>
                    <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span class="text-lg font-bold accent-text block">${overallBestStreak}</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">Nejlepší série</span>
                    </div>
                    <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <span class="text-lg font-bold accent-text block">${totalCompletionsAll}</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">Splněno celkem</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Podle denních bloků</h3>
                    <div class="space-y-2">${slotStatsHtml}</div>
                </div>

                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Jednotlivé návyky</h3>
                    <div class="space-y-2">${habitsStatsHtml}</div>
                </div>
            `;
        }

        function toggleSection(slotKey) {
            triggerHaptic();
            manuallyExpanded[slotKey] = !manuallyExpanded[slotKey];
            render();
        }

        function saveAndRender() {
            updateCompletedDays();
            localStorage.setItem('habits_v7', JSON.stringify(habits));
            render();
        }

        function render() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            const slots = [
                { key: 'priority', title: '🎯 Denní priority (Celý den)', isPriority: true },
                { key: 'morning', title: '🌅 Ranní návyky', isPriority: false },
                { key: 'afternoon', title: '☀️ Odpolední návyky', isPriority: false },
                { key: 'evening', title: '🌙 Večerní návyky', isPriority: false }
            ];

            let totalDone = 0;
            let totalCount = habits.length;

            slots.forEach(slot => {
                let slotHabits = habits.filter(h => h.timeSlot === slot.key);
                if (slotHabits.length === 0) return;

                slotHabits.sort((a, b) => (a.done === b.done)? 0 : a.done ? 1 : -1);

                const doneInSlot = slotHabits.filter(h => h.done).length;
                totalDone += doneInSlot;
                const allDone = doneInSlot === slotHabits.length;

                const isCollapsed = allDone && !manuallyExpanded[slot.key];

                if (isCollapsed) {
                    container.innerHTML += `
                        <div onclick="toggleSection('${slot.key}')" class="flex items-center justify-between p-4 rounded-3xl cursor-pointer transition-all active:scale-[0.99] shadow-sm bg-white dark:bg-slate-900/60" style="border: 2px solid var(--accent-color);">
                            <div class="flex items-center gap-3">
                                <span class="text-lg">✅</span>
                                <div>
                                    <h3 class="text-sm font-bold text-slate-900 dark:text-white">${slot.title}</h3>
                                    <span class="text-xs text-slate-500 dark:text-slate-400">Hotovo (${doneInSlot}/${slotHabits.length}) • Klepni pro zobrazení</span>
                                </div>
                            </div>
                            <span class="text-xs font-bold accent-text">▼</span>
                        </div>
                    `;
                    return;
                }

                const boxStyle = slot.isPriority 
                    ? 'bg-amber-50/50 dark:bg-amber-950/20 border-amber-200 dark:border-amber-500/40' 
                    : 'bg-white dark:bg-slate-900/60 border-slate-200 dark:border-slate-800 shadow-sm';
                
                const titleColor = slot.isPriority ? 'text-amber-700 dark:text-amber-400' : 'text-slate-500 dark:text-slate-400';

                let html = `
                    <div class="p-4 rounded-3xl border ${boxStyle} transition-all">
                        <div onclick="${allDone ? `toggleSection('${slot.key}')` : ''}" class="flex justify-between items-center mb-3 ${allDone ? 'cursor-pointer' : ''}">
                            <h3 class="text-xs font-bold ${titleColor} uppercase tracking-wider">${slot.title}</h3>
                            <span class="text-xs text-slate-400">${doneInSlot}/${slotHabits.length} ${allDone ? '▲' : ''}</span>
                        </div>
                        <div class="space-y-2.5">
                `;

                slotHabits.forEach(habit => {
                    const realIndex = habits.findIndex(h => h.id === habit.id);

                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/90 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 transition-all duration-300">
                            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleHabit(${realIndex})">
                                <span class="text-xl w-10 h-10 flex items-center justify-center rounded-2xl shrink-0 shadow-sm" style="background-color: ${habit.color}20; color: ${habit.color}">${habit.icon}</span>
                                <div>
                                    <span class="${habit.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-900 dark:text-white font-medium'} text-sm block leading-tight transition-all">${habit.title}</span>
                                    <span class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 block">🔥 ${habit.streak} dní v řadě</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 ml-2">
                                <button onclick="toggleHabit(${realIndex})" class="w-8 h-8 rounded-full flex items-center justify-center text-sm border transition-all ${habit.done ? 'accent-bg accent-border text-white dark:text-slate-950 font-bold shadow-md' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-transparent'}">
                                    ${habit.done ? '✓' : ''}
                                </button>
                                <button onclick="deleteHabit(${realIndex})" class="text-slate-400 hover:text-red-500 p-1.5 text-xs transition-colors">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });

            const percent = totalCount > 0 ? Math.round((totalDone / totalCount) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `${totalDone} z ${totalCount} splněno (${percent} %)`;
            
            const maxStreak = habits.length > 0 ? Math.max(...habits.map(h => h.streak || 0)) : 0;
            document.getElementById('streakText').innerText = `🔥 Max série: ${maxStreak} dní`;
        }

        function toggleHabit(index) {
            triggerHaptic();
            const habit = habits[index];
            const slotKey = habit.timeSlot;

            if (!habit.done) {
                habit.done = true;
                habit.lastDoneDate = todayKey;
                habit.streak = (habit.streak || 0) + 1;
                habit.totalCompletions = (habit.totalCompletions || 0) + 1;
                if (habit.streak > (habit.bestStreak || 0)) {
                    habit.bestStreak = habit.streak;
                }
                manuallyExpanded[slotKey] = false;
            } else {
                habit.done = false;
                habit.lastDoneDate = null;
                habit.streak = Math.max(0, (habit.streak || 1) - 1);
                habit.totalCompletions = Math.max(0, (habit.totalCompletions || 1) - 1);
            }

            saveAndRender();
        }

        function addHabit() {
            const titleInput = document.getElementById('habitInput');
            if (!titleInput.value.trim()) return;

            triggerHaptic();
            const slot = document.getElementById('timeSlotInput').value;
            const newHabit = {
                id: Date.now(),
                title: titleInput.value.trim(),
                timeSlot: slot,
                color: document.getElementById('colorInput').value,
                icon: document.getElementById('iconInput').value || '⭐',
                done: false,
                streak: 0,
                bestStreak: 0,
                totalCompletions: 0,
                lastDoneDate: null
            };

            habits.push(newHabit);
            manuallyExpanded[slot] = true;
            titleInput.value = '';
            closeModal();
            saveAndRender();
        }

        function deleteHabit(index) {
            triggerHaptic();
            if (confirm('Opravdu chceš tento návyk smazat?')) {
                habits.splice(index, 1);
                saveAndRender();
            }
        }

        render();
    </script>
</body>
</html>
