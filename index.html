<!DOCTYPE html>
<html lang="cs" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        input[type="text"].app-title-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }
        :root {
            --accent-color: #10b981; 
        }
        .accent-text { color: var(--accent-color) !important; }
        .accent-bg { background-color: var(--accent-color) !important; }
        .accent-border { border-color: var(--accent-color) !important; }
        input.app-title-input:focus {
            border-bottom: 1px dashed var(--accent-color);
        }
        @keyframes softAlertPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.0);
                border-color: rgba(245, 158, 11, 0.45);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.22);
                border-color: #f59e0b;
            }
        }
        .reminder-ringing {
            animation: softAlertPulse 1.4s ease-in-out infinite;
            background-color: rgba(245, 158, 11, 0.08) !important;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-28 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300">

    <!-- Hlavička a Progress bar -->
    <header class="mb-6 mt-2 relative">
        <div class="flex justify-between items-center mb-2 gap-1.5">
            <input type="text" id="appTitleInput" value="Moje Návyky" onchange="saveAppTitle(this.value)" class="text-xl sm:text-2xl font-bold accent-text app-title-input min-w-0" placeholder="Název aplikace...">
            
            <div class="flex items-center gap-1.5 shrink-0 relative">
                <!-- Přepínač jazyka (CS / EN / DE / ES) -->
                <div class="relative">
                    <button onclick="toggleLangMenu()" id="langToggleBtn" class="h-9 px-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-xs font-bold transition-transform active:scale-90" title="Language / Jazyk">
                        CS
                    </button>
                    <div id="langMenu" class="hidden absolute right-0 mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-1.5 z-50 flex flex-col gap-1 min-w-[110px]">
                        <button onclick="setLanguage('cs')" class="px-3 py-1.5 rounded-xl text-left text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 flex justify-between items-center">
                            <span>🇨🇿 Čeština</span>
                            <span id="langCheck_cs" class="accent-text font-bold">✓</span>
                        </button>
                        <button onclick="setLanguage('en')" class="px-3 py-1.5 rounded-xl text-left text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 flex justify-between items-center">
                            <span>🇬🇧 English</span>
                            <span id="langCheck_en" class="accent-text font-bold hidden">✓</span>
                        </button>
                        <button onclick="setLanguage('de')" class="px-3 py-1.5 rounded-xl text-left text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 flex justify-between items-center">
                            <span>🇩🇪 Deutsch</span>
                            <span id="langCheck_de" class="accent-text font-bold hidden">✓</span>
                        </button>
                        <button onclick="setLanguage('es')" class="px-3 py-1.5 rounded-xl text-left text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 flex justify-between items-center">
                            <span>🇪🇸 Español</span>
                            <span id="langCheck_es" class="accent-text font-bold hidden">✓</span>
                        </button>
                    </div>
                </div>

                <!-- Tlačítko pro rozbalení palety barev -->
                <div class="relative">
                    <button onclick="toggleColorMenu()" id="colorBtn" class="w-9 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-sm transition-transform active:scale-90" title="Vybrat barvu">
                        🎨
                    </button>
                    <div id="colorMenu" class="hidden absolute right-0 mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-2 z-50 flex gap-2">
                        <button onclick="setAccentColor(0)" class="w-7 h-7 rounded-full bg-emerald-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setAccentColor(1)" class="w-7 h-7 rounded-full bg-red-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setAccentColor(2)" class="w-7 h-7 rounded-full bg-blue-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setAccentColor(3)" class="w-7 h-7 rounded-full bg-purple-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setAccentColor(4)" class="w-7 h-7 rounded-full bg-amber-500 hover:scale-110 transition-transform"></button>
                    </div>
                </div>

                <!-- Tlačítko pro přepínání režimu (Světlý / Tmavý) -->
                <button onclick="toggleTheme()" id="themeToggleBtn" class="w-9 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-base transition-transform active:scale-90" title="Přepnout vzhled">
                    🌙
                </button>
                <span id="dateLabel" class="text-xs text-slate-500 dark:text-slate-400 capitalize ml-0.5"></span>
            </div>
        </div>
        <div class="bg-slate-200 dark:bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner">
            <div id="progressBar" class="accent-bg h-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center mt-1.5 text-xs text-slate-500 dark:text-slate-400">
            <span id="progressText">0 z 0 splněno</span>
            <span id="streakText">🔥 Max série: 0 dní</span>
        </div>
    </header>

    <!-- Banner aktivního upozornění -->
    <div id="reminderBanner" class="hidden mb-4 p-3.5 rounded-2xl bg-amber-100 dark:bg-amber-950/70 border border-amber-400/70 text-amber-950 dark:text-amber-100 shadow-md items-center justify-between gap-2">
        <div class="text-xs">
            <span class="font-bold block" id="reminderBannerTitle">🔔 Čas na návyk!</span>
            <span id="reminderBannerText" class="text-amber-800 dark:text-amber-200/90"></span>
        </div>
        <button onclick="dismissReminderBanner()" id="reminderOkBtn" class="px-2.5 py-1 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-xs font-bold shrink-0">OK</button>
    </div>
    <!-- Seznam návyků -->
    <div id="sectionsContainer" class="space-y-4"></div>
    <!-- Plovoucí tlačítka vpravo dole -->
    <div class="fixed bottom-6 right-6 flex items-center gap-3 z-40">
        <button onclick="openStatsModal()" id="statsBtn" class="w-14 h-14 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-full shadow-xl flex items-center justify-center text-2xl transition-all" title="Statistiky">
            📊
        </button>
        <button onclick="openCatalogModal()" id="catalogBtn" class="w-14 h-14 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 accent-text border border-slate-200 dark:border-slate-700 rounded-full shadow-xl flex items-center justify-center text-2xl transition-all" title="Kniha návyků">
            📚
        </button>
        <button onclick="openModal()" id="addBtn" class="w-14 h-14 accent-bg hover:opacity-90 active:scale-95 text-white dark:text-slate-950 rounded-full shadow-xl flex items-center justify-center text-3xl font-bold transition-all">
            +
        </button>
    </div>

    <!-- Modální okno: Přidání vlastního návyku -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold" id="addModalTitle">✨ Nový návyk</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1" id="habitNameLabel">Název návyku</label>
                    <input type="text" id="habitInput" placeholder="Např. Vzít léky před odchodem..." class="w-full p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none transition-colors">
                </div>
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1" id="timeSlotLabel">Kdy ho chceš plnit?</label>
                    <select id="timeSlotInput" class="w-full p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none transition-colors">
                        <option value="priority" id="optPriority">🎯 Denní priorita (Celý den)</option>
                        <option value="morning" id="optMorning" selected>🌅 Ráno</option>
                        <option value="afternoon" id="optAfternoon">☀️ Odpoledne</option>
                        <option value="evening" id="optEvening">🌙 Večer</option>
                    </select>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1" id="iconLabel">Ikona (Emoji)</label>
                        <input type="text" id="iconInput" value="⭐" class="w-full text-center p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-lg">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1" id="colorLabel">Barva štítku</label>
                        <input type="color" id="colorInput" value="#10b981" class="w-full h-[50px] rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer p-1">
                    </div>
                </div>

                <!-- Upozornění -->
                <div class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold block" id="newReminderTitle">🔔 Upozornění v určitý čas</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400" id="newReminderSub">Ve výchozím stavu je vypnuté</span>
                        </div>
                        <input type="checkbox" id="reminderEnabledInput" onchange="toggleNewReminderTimeBox()" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                    </div>
                    <div id="newReminderTimeBox" class="hidden pt-1">
                        <label class="text-[11px] text-slate-500 dark:text-slate-400 block mb-1" id="newReminderTimeLabel">Čas upozornění</label>
                        <input type="time" id="reminderTimeInput" value="06:00" class="w-full p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                    </div>
                </div>

                <button onclick="addHabit()" id="saveHabitBtn" class="w-full accent-bg font-bold py-3.5 rounded-2xl text-sm active:scale-95 text-white dark:text-slate-950 mt-2 shadow-lg transition-all">
                    Uložit návyk
                </button>
            </div>
        </div>
    </div>

    <!-- Modální okno: Úprava upozornění -->
    <div id="reminderEditModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold" id="editReminderHabitTitle">🔔 Nastavení upozornění</h2>
                <button onclick="closeReminderEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            <div class="space-y-4">
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <span class="text-xs font-bold" id="editReminderToggleLabel">Zapnout upozornění</span>
                    <input type="checkbox" id="editReminderEnabled" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                </div>
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1" id="editReminderTimeLabel">V kolik hodin upozornit?</label>
                    <input type="time" id="editReminderTime" class="w-full p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                </div>
                <button onclick="saveEditedReminder()" id="saveReminderBtn" class="w-full accent-bg font-bold py-3.5 rounded-2xl text-sm active:scale-95 text-white dark:text-slate-950 shadow-lg transition-all">
                    Uložit upozornění
                </button>
            </div>
        </div>
    </div>

    <!-- Modální okno: Katalog návyků -->
    <div id="catalogModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md max-h-[85vh] flex flex-col p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h2 class="text-base font-bold" id="catalogTitle">📚 Knihovna návyků</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="catalogSubtitle">Přidej si ověřené návyky jedním kliknutím</p>
                </div>
                <button onclick="closeCatalogModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div id="catalogList" class="overflow-y-auto space-y-3 pr-1 flex-1 py-2"></div>
        </div>
    </div>

    <!-- Modální okno: Statistiky -->
    <div id="statsModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md max-h-[85vh] flex flex-col p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl mb-2 sm:mb-0 transition-all">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h2 class="text-base font-bold" id="statsTitle">📊 Statistiky a série</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="statsSubtitle">Celkové skóre a přehled jednotlivých návyků</p>
                </div>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl leading-none px-2">✕</button>
            </div>
            
            <div id="statsContent" class="overflow-y-auto space-y-4 pr-1 flex-1 py-2"></div>
        </div>
    </div>

        function updateCompletedDays() {
            const anyDoneToday = habits.some(h => h.done);
            const idx = completedDays.indexOf(todayKey);
            if (anyDoneToday && idx === -1) {
                completedDays.push(todayKey);
            } else if (!anyDoneToday && idx !== -1) {
                completedDays.splice(idx, 1);
            }
            localStorage.setItem('completed_days_v9', JSON.stringify(completedDays));
        }

        function updateReminderBanner() {
            const banner = document.getElementById('reminderBanner');
            const activeHabits = habits.filter(h => ringingHabitIds.includes(h.id) && !h.done && h.reminderEnabled);
            ringingHabitIds = activeHabits.map(h => h.id);

            if (activeHabits.length === 0) {
                banner.classList.add('hidden');
                banner.classList.remove('flex');
                return;
            }

            const names = activeHabits.map(h => `${h.icon} ${h.title} (${h.reminderTime})`).join(', ');
            document.getElementById('reminderBannerText').innerText = names;
            banner.classList.remove('hidden');
            banner.classList.add('flex');
        }

        function dismissReminderBanner() {
            triggerHaptic([20]);
            ringingHabitIds = [];
            updateReminderBanner();
            render();
        }

        function checkReminders() {
            const dict = t();
            const currentHHMM = getCurrentTimeHHMM();
            const minuteStamp = `${todayKey}_${currentHHMM}`;
            if (minuteStamp === lastTriggeredMinute) return;

            let newlyTriggered = [];
            habits.forEach(h => {
                if (h.reminderEnabled && !h.done && h.reminderTime === currentHHMM) {
                    if (!ringingHabitIds.includes(h.id)) {
                        ringingHabitIds.push(h.id);
                        newlyTriggered.push(h);
                    }
                }
            });

            if (newlyTriggered.length > 0) {
                lastTriggeredMinute = minuteStamp;
                triggerHaptic([80, 60, 80, 60, 120]);
                if ('Notification' in window && Notification.permission === 'granted') {
                    newlyTriggered.forEach(h => {
                        new Notification(dict.browserNotifTitle, {
                            body: `${h.icon} ${h.title} (${h.reminderTime})`
                        });
                    });
                }
                updateReminderBanner();
                render();
            }
        }

                title: preset.title,
                timeSlot: preset.timeSlot,
                color: preset.color,
                icon: preset.icon,
                done: false,
                streak: 0,
                bestStreak: 0,
                totalCompletions: 0,
                lastDoneDate: null,
                reminderEnabled: false,

        function render() {
            const dict = t();
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            const slots = [
                { key: 'priority', title: dict.slotTitlePriority, isPriority: true },
                { key: 'morning', title: dict.slotTitleMorning, isPriority: false },
                { key: 'afternoon', title: dict.slotTitleAfternoon, isPriority: false },
                { key: 'evening', title: dict.slotTitleEvening, isPriority: false }
            ];

            let totalDone = 0;
            let totalCount = habits.length;

            slots.forEach(slot => {
                let slotHabits = habits.filter(h => h.timeSlot === slot.key);
                if (slotHabits.length === 0) return;

                slotHabits.sort((a, b) => (a.done === b.done)? 0 : a.done ? 1 : -1);

                const doneInSlot = slotHabits.filter(h => h.done).length;
                totalDone += doneInSlot;
                const allDone = doneInSlot === slotHabits.length;

                const isCollapsed = allDone && !manuallyExpanded[slot.key];

                if (isCollapsed) {
                    container.innerHTML += `
                        <div onclick="toggleSection('${slot.key}')" class="flex items-center justify-between p-4 rounded-3xl cursor-pointer transition-all active:scale-[0.99] shadow-sm bg-white dark:bg-slate-900/60" style="border: 2px solid var(--accent-color);">
                            <div class="flex items-center gap-3">
                                <span class="text-lg">✅</span>
                                <div>
                                    <h3 class="text-sm font-bold text-slate-900 dark:text-white">${slot.title}</h3>
                                    <span class="text-xs text-slate-500 dark:text-slate-400">${dict.collapsedDoneText(doneInSlot, slotHabits.length)}</span>
                                </div>
                            </div>
                            <span class="text-xs font-bold accent-text">▼</span>
                        </div>
                    `;
                    return;
                }

                const boxStyle = slot.isPriority 
                    ? 'bg-amber-50/50 dark:bg-amber-950/20 border-amber-200 dark:border-amber-500/40' 
                    : 'bg-white dark:bg-slate-900/60 border-slate-200 dark:border-slate-800 shadow-sm';
                
                const titleColor = slot.isPriority ? 'text-amber-700 dark:text-amber-400' : 'text-slate-500 dark:text-slate-400';

                let html = `
                    <div class="p-4 rounded-3xl border ${boxStyle} transition-all">
                        <div onclick="${allDone ? `toggleSection('${slot.key}')` : ''}" class="flex justify-between items-center mb-3 ${allDone ? 'cursor-pointer' : ''}">
                            <h3 class="text-xs font-bold ${titleColor} uppercase tracking-wider">${slot.title}</h3>
                            <span class="text-xs text-slate-400">${doneInSlot}/${slotHabits.length} ${allDone ? '▲' : ''}</span>
                        </div>
                        <div class="space-y-2.5">
                `;

                slotHabits.forEach(habit => {
                    const realIndex = habits.findIndex(h => h.id === habit.id);
                    const isRinging = ringingHabitIds.includes(habit.id) && !habit.done && habit.reminderEnabled;
                    const reminderBadge = habit.reminderEnabled
                        ? `<button onclick="openReminderEditModal(${realIndex})" class="text-[10px] px-2 py-0.5 rounded-lg bg-amber-500/15 text-amber-600 dark:text-amber-400 font-semibold">🔔 ${habit.reminderTime}</button>`
                        : `<button onclick="openReminderEditModal(${realIndex})" class="text-[10px] px-1.5 py-0.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" title="${dict.setReminderTitle}">🔕</button>`;

                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/90 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 transition-all duration-300 ${isRinging ? 'reminder-ringing' : ''}">
                            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleHabit(${realIndex})">
                                <span class="text-xl w-10 h-10 flex items-center justify-center rounded-2xl shrink-0 shadow-sm" style="background-color: ${habit.color}20; color: ${habit.color}">${habit.icon}</span>
                                <div>
                                    <span class="${habit.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-900 dark:text-white font-medium'} text-sm block leading-tight transition-all">${habit.title}</span>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-[11px] text-slate-500 dark:text-slate-400">${dict.streakInRow(habit.streak)}</span>
                                        <span onclick="event.stopPropagation()">${reminderBadge}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 ml-2">
                                <button onclick="toggleHabit(${realIndex})" class="w-8 h-8 rounded-full flex items-center justify-center text-sm border transition-all ${habit.done ? 'accent-bg accent-border text-white dark:text-slate-950 font-bold shadow-md' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-transparent'}">
                                    ${habit.done ? '✓' : ''}
                                </button>
                                <button onclick="deleteHabit(${realIndex})" class="text-slate-400 hover:text-red-500 p-1.5 text-xs transition-colors">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });

            const percent = totalCount > 0 ? Math.round((totalDone / totalCount) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = dict.progressDone(totalDone, totalCount, percent);
            
            const maxStreak = habits.length > 0 ? Math.max(...habits.map(h => h.streak || 0)) : 0;
            document.getElementById('streakText').innerText = dict.maxStreakHeader(maxStreak);
        }

        function toggleHabit(index) {
            triggerHaptic();
            const habit = habits[index];
            const slotKey = habit.timeSlot;

            if (!habit.done) {
                habit.done = true;
                habit.lastDoneDate = todayKey;
                habit.streak = (habit.streak || 0) + 1;
                habit.totalCompletions = (habit.totalCompletions || 0) + 1;
                if (habit.streak > (habit.bestStreak || 0)) {
                    habit.bestStreak = habit.streak;
                }
                ringingHabitIds = ringingHabitIds.filter(id => id !== habit.id);
                manuallyExpanded[slotKey] = false;
            } else {
                habit.done = false;
                habit.lastDoneDate = null;
                habit.streak = Math.max(0, (habit.streak || 1) - 1);
                habit.totalCompletions = Math.max(0, (habit.totalCompletions || 1) - 1);
            }

            saveAndRender();
        }

        function addHabit() {
            const titleInput = document.getElementById('habitInput');
            if (!titleInput.value.trim()) return;

            triggerHaptic();
            const slot = document.getElementById('timeSlotInput').value;
            const reminderEnabled = document.getElementById('reminderEnabledInput').checked;
            const reminderTime = document.getElementById('reminderTimeInput').value || '07:00';

            const newHabit = {
                id: Date.now(),
                title: titleInput.value.trim(),
                timeSlot: slot,
                color: document.getElementById('colorInput').value,
                icon: document.getElementById('iconInput').value || '⭐',
                done: false,
                streak: 0,
                bestStreak: 0,
                totalCompletions: 0,
                lastDoneDate: null,
                reminderEnabled: reminderEnabled,
                reminderTime: reminderTime
            };

            habits.push(newHabit);
            manuallyExpanded[slot] = true;
            titleInput.value = '';
            closeModal();
            saveAndRender();
        }

        function deleteHabit(index) {
            triggerHaptic();
            if (confirm(t().deleteConfirm)) {
                const removed = habits[index];
                ringingHabitIds = ringingHabitIds.filter(id => id !== removed.id);
                habits.splice(index, 1);
                saveAndRender();
            }
        }

        applyLanguageUI();
        render();
        checkReminders();
        setInterval(checkReminders, 15000);
    </script>
</body>
</html>
