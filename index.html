<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="p-5 max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-emerald-400">Moje Návyky</h1>

    <!-- Formulář pro přidání -->
    <div class="flex gap-2 mb-6">
        <input type="text" id="habitInput" placeholder="Nový návyk..." class="flex-1 p-3 rounded-xl bg-slate-800 text-white border border-slate-700 outline-none">
        <button onclick="addHabit()" class="bg-emerald-500 font-bold px-5 py-3 rounded-xl active:bg-emerald-600">+</button>
    </div>

    <!-- Seznam návyků -->
    <div id="habitList" class="space-y-3"></div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [
            { id: 1, title: 'Pít dostatek vody', done: false },
            { id: 2, title: 'Cvičení / protažení', done: true }
        ];

        function render() {
            const list = document.getElementById('habitList');
            list.innerHTML = '';
            habits.forEach((h, index) => {
                list.innerHTML += `
                    <div onclick="toggleHabit(${index})" class="flex items-center justify-between p-4 bg-slate-800 rounded-xl border border-slate-700 cursor-pointer">
                        <span class="${h.done ? 'line-through text-slate-500' : 'text-white font-medium'}">${h.title}</span>
                        <span class="text-2xl">${h.done ? '✅' : '⚪'}</span>
                    </div>
                `;
            });
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (!input.value.trim()) return;
            habits.push({ id: Date.now(), title: input.value, done: false });
            input.value = '';
            render();
        }

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            render();
        }

        render();
    </script>
</body>
</html>
